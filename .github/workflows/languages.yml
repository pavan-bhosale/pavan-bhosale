name: Generate languages card

on:
  schedule:
    # Execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate languages.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=6&theme=buefy&hide_border=true
          path: dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate languages SVG
        run: |
          echo "Verifying dist/languages.svg..."
          if [ ! -s "dist/languages.svg" ]; then
            echo "Error: dist/languages.svg is missing or empty!" >&2
            exit 1
          fi
          if ! grep -q "<svg" "dist/languages.svg"; then
            echo "Error: dist/languages.svg does not contain valid SVG markup!" >&2
            exit 1
          fi
          echo "Validation passed."
          ls -la dist/

      - name: Push languages.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
