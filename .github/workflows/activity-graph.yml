name: Update Activity Graph

on:
  schedule:
    # Execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: radius=16&theme=cotton-candy&area=true&hide_border=true&hide_title=false&custom_title=CONTRIBUTION%20GRAPH
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate activity graph SVG
        run: |
          echo "Verifying dist/activity-graph.svg..."
          if [ ! -s "dist/activity-graph.svg" ]; then
            echo "Error: dist/activity-graph.svg is missing or empty!" >&2
            exit 1
          fi
          if ! grep -q "<svg" "dist/activity-graph.svg"; then
            echo "Error: dist/activity-graph.svg does not contain valid SVG markup!" >&2
            exit 1
          fi
          echo "Validation passed."
          ls -la dist/

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
