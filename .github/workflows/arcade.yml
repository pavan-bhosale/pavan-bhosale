name: Generate arcade animation

on:
  schedule:
    # Execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Validate generated SVGs
        run: |
          echo "Verifying generated files in dist/..."
          if [ ! -d "dist" ]; then
            echo "Error: dist directory does not exist!" >&2
            exit 1
          fi
          if [ ! -s "dist/pacman-contribution-graph.svg" ]; then
            echo "Error: dist/pacman-contribution-graph.svg is missing or empty!" >&2
            exit 1
          fi
          if [ ! -s "dist/pacman-contribution-graph-dark.svg" ]; then
            echo "Error: dist/pacman-contribution-graph-dark.svg is missing or empty!" >&2
            exit 1
          fi
          if ! grep -q "<svg" "dist/pacman-contribution-graph.svg"; then
            echo "Error: dist/pacman-contribution-graph.svg does not contain valid SVG markup!" >&2
            exit 1
          fi
          if ! grep -q "<svg" "dist/pacman-contribution-graph-dark.svg"; then
            echo "Error: dist/pacman-contribution-graph-dark.svg does not contain valid SVG markup!" >&2
            exit 1
          fi
          echo "Validation passed. Output assets:"
          ls -la dist/

      - name: Push Pac-Man SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
